<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: ให้แอปใช้พื้นที่ถึงขอบโค้งของ iPhone (จัดระยะด้วย safe-area ใน CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FreeBox</title>
    <meta name="description" content="จดรายรับ-รายจ่าย การบ้าน และโน้ต ในที่เดียว" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: ข้อมูลแอปสำหรับการติดตั้ง -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />

    <!-- iPhone/iPad: ไอคอนบนหน้าจอโฮม และเปิดแบบเต็มจอไม่มีแถบ Safari -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FreeBox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
